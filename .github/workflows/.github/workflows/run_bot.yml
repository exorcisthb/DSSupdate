name: Tu dong chay cap nhat du lieu 8h sang

on:
  schedule:
    # 8h sáng Việt Nam tương đương với 1h sáng giờ quốc tế UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Dòng này giúp bạn có thể bấm nút chạy thử thủ công bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kiem tra thu muc code
      uses: actions/checkout@v3

    - name: Cai dat Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cai dat thu vien can thiet
      run: |
        pip install pandas openpyxl requests

    - name: Chay file Python cap nhat du lieu
      run: python script.py

    - name: Luu file Excel moi de len GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add tiki_historical_data.xlsx
        git commit -m "Bot tu dong cap nhat ngay $(date +'%Y-%m-%d')" || exit 0
        git push
